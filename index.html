<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Melodias</title>
    <script>
      // aplica o tema salvo antes da primeira pintura, para não piscar
      try {
        const saved = JSON.parse(localStorage.getItem('melodias:view') || '{}')
        if (saved.state && saved.state.theme) document.documentElement.dataset.theme = saved.state.theme
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
